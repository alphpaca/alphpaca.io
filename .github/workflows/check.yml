name: Verify website
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site: https://alphpaca.io
            base: /
            test_base: ''
          - site: https://example.github.io
            base: /alphpacaio
            test_base: /alphpacaio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ matrix.site }}
          BASE_PATH: ${{ matrix.base }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TEST_BASE_PATH: ${{ matrix.test_base }}
