name: Verify website
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: https://example.github.io
          BASE_PATH: /alphpacaio
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TEST_BASE_PATH: /alphpacaio
